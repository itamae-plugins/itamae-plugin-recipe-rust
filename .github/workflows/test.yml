name: test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    runs-on: ${{ case(inputs.ruby < '3.0', 'ubuntu-24.04', 'ubuntu-latest') }}

    strategy:
      fail-fast: false

      matrix:
        ruby:
          - 2.3
        image:
          - debian:bookworm
          - amazonlinux:2
          - ubuntu:focal
          - ubuntu:jammy
        test_task:
          - test:system
          - test:user

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: bundle update
        run: |
          set -xe
          bundle config --local path $PWD/vendor/bundle
          bundle config --local jobs $(nproc)
          bundle update --retry 3

      - name: Run test
        run: bundle exec rake ${TEST_TASK}
        env:
          SOURCE_IMAGE: ${{ matrix.image }}
          TEST_TASK: ${{ matrix.test_task }}

      - name: Slack Notification (not success)
        uses: act10ns/slack@v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          matrix: ${{ toJson(matrix) }}

  all-pass:
    if: always()

    needs:
      - test

    runs-on: ubuntu-slim

    steps:
      - name: check dependent jobs
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
